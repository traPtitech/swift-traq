name: automatic update

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  skip:
    runs-on: ubuntu-latest
    steps:
      - run: echo "[Skip CI] ${{ contains(github.event.head_commit.message, '[skip ci]') }}"
  release:
    name: release
    runs-on: ubuntu-24.04
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup Swift
        id: swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: '6.2.0'
      - name: cache packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./.build
          key: ${{ runner.os }}-swift-${{ steps.swift.outputs.version }}-${{ hashFiles('./Package.resolved') }}
      - name: build
        run: sh ./generate.sh
      - name: Check diff
        run: |
          git add .
          DIFFS=`git diff --name-only HEAD`
          echo $DIFFS

          if [ "$DIFFS" = '' ]; then
            echo "HAS_DIFF=false" >> $GITHUB_ENV
          else
            echo "HAS_DIFF=true" >> $GITHUB_ENV
          fi

          git reset HEAD
      - name: git commit
        if: env.HAS_DIFF == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add .
          git commit -m "CI: regenerate [ci skip]" --author="ras0q <66677201+ras0q@users.noreply.github.com>"
      - name: git push
        if: env.HAS_DIFF == 'true'
        uses: ad-m/github-push-action@a3fd843e49cd58d296bdd2431c4853569a1b900f
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
